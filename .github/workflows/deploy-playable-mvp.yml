name: Deploy iTab Quest MVP to Pages

on:
  push:
    branches:
      - playable-mvp
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage site
        run: |
          mkdir -p _site/itab_quest_approved_assets_v1
          cp -R game/* _site/
          cp -R itab_quest_approved_assets_v1/backgrounds _site/itab_quest_approved_assets_v1/
          cp -R itab_quest_approved_assets_v1/characters _site/itab_quest_approved_assets_v1/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
